<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOLA</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const mouse = { x: -9999, y: -9999, r: 90 };
    let particles = [];

    function buildParticles() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Pinta el texto en un canvas auxiliar y muestrea los píxeles opacos.
      const off = document.createElement('canvas');
      off.width = window.innerWidth;
      off.height = window.innerHeight;
      const octx = off.getContext('2d');
      const size = Math.min(window.innerWidth * 0.35, window.innerHeight * 0.6);
      octx.fillStyle = '#fff';
      octx.font = `bold ${size}px Arial, sans-serif`;
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.fillText('HOLA', window.innerWidth / 2, window.innerHeight / 2);

      const data = octx.getImageData(0, 0, off.width, off.height).data;
      const step = Math.max(4, Math.round(size / 60));
      particles = [];
      for (let y = 0; y < off.height; y += step) {
        for (let x = 0; x < off.width; x += step) {
          if (data[(y * off.width + x) * 4 + 3] > 128) {
            particles.push({ x: Math.random() * off.width, y: Math.random() * off.height,
                             tx: x, ty: y, vx: 0, vy: 0 });
          }
        }
      }
    }

    function frame() {
      ctx.fillStyle = 'rgba(11, 13, 18, 0.35)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        // Atracción hacia el destino
        p.vx += (p.tx - p.x) * 0.02;
        p.vy += (p.ty - p.y) * 0.02;
        // Repulsión del ratón
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < mouse.r * mouse.r) {
          const d = Math.sqrt(d2) || 1;
          const f = (mouse.r - d) / mouse.r * 2;
          p.vx += dx / d * f;
          p.vy += dy / d * f;
        }
        p.vx *= 0.85;
        p.vy *= 0.85;
        p.x += p.vx;
        p.y += p.vy;
        ctx.fillStyle = '#ffd166';
        ctx.fillRect(p.x, p.y, 2, 2);
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
    window.addEventListener('resize', buildParticles);

    buildParticles();
    frame();
  </script>
</body>
</html>
